# The register of factual and numerical claims on the learning and tool pages.
# Each entry names the claim, where it is used, the source, and what was done
# with the source. Statuses: checked, vendor, derived, standard.
checked_on: 2026-10-23
claims:
  - claim: "A 2048-bit RSA number can be factored with fewer than one million noisy qubits in less than a week, under the hardware assumptions in the paper."
    where: [/learn/what-quantum-computers-are-for/, /pqc/what-a-quantum-computer-breaks/]
    source: 'Gidney, "How to factor 2048 bit RSA integers with less than a million noisy qubits", arXiv:2505.15917, 21 May 2025'
    url: https://arxiv.org/abs/2505.15917
    status: checked
    note: Title and abstract read.

  - claim: "For the surface code, the logical error rate per cycle is fitted by P_L = 0.03 (p / p_th)^((d + 1) / 2) with a per-step threshold of 0.57%."
    where: [/overhead/, /learn/error-correction-in-one-page/]
    source: 'Fowler, Mariantoni, Martinis and Cleland, "Surface codes: Towards practical large-scale quantum computation", arXiv:1208.0928'
    url: https://arxiv.org/abs/1208.0928
    status: checked
    note: Equation 11 and the threshold stated with Fig. 4 read in the full text. The threshold depends on the implementation.

  - claim: "Matching-based decoding gives a threshold of about 0.78% with imperfect syndrome extraction (toric code), and the surface code is close to the toric code."
    where: [/threshold/, /learn/error-correction-in-one-page/]
    source: 'Wang, Fowler, Stephens and Hollenberg, "Threshold error rates for the toric and surface codes", arXiv:0905.0531'
    url: https://arxiv.org/abs/0905.0531
    status: checked
    note: Abstract read.

  - claim: "The simulated curves for surface codes of distance 5 and 9 cross at about 0.73% physical error rate per operation."
    where: [/threshold/, /overhead/, /learn/error-correction-in-one-page/]
    source: "The simulation on this site: data at /threshold.json, script tools/threshold_sim.py"
    url: /threshold.json
    status: derived
    note: One noise model, one decoder. The crossing moves with the pair of distances compared.

  - claim: "A fit of the logical error rate with threshold 0.73% gives a prefactor of about 0.008, within a factor of about 1.4 of the points used."
    where: [/overhead/]
    source: "The simulation on this site"
    url: /threshold.json
    status: derived
    note: The best-fit prefactor falls as the distance grows.

  - claim: "A trapped-ion two-qubit gate error of 8.4(7) x 10^-5 was estimated on a laboratory prototype, without ground-state cooling."
    where: [/learn/why-qubits-go-wrong/]
    source: 'IonQ, "Trapped-ion two-qubit gates with >99.99% fidelity without ground-state cooling", arXiv:2510.17286'
    url: https://arxiv.org/abs/2510.17286
    status: vendor
    note: Abstract read. The figure is the vendor's estimate and has not been independently verified. The abstract does not say whether it was measured on an isolated pair or in a full device.

  - claim: "A 105-qubit superconducting processor had a mean T1 of 68 microseconds, a T2 (CPMG) of 89 microseconds and a controlled-Z gate duration of 42 nanoseconds."
    where: [/learn/reading-a-hardware-spec-sheet/]
    source: 'Google Quantum AI, "Quantum error correction below the surface code threshold", arXiv:2408.13687 (Nature 638, 920, 2025)'
    url: https://arxiv.org/abs/2408.13687
    status: checked
    note: Values read in the text of the paper.

  - claim: "Magic state cultivation reports about an order of magnitude fewer qubit-rounds than prior approaches for the same logical error rate."
    where: [/learn/gates-circuits-and-the-expensive-gate/]
    source: 'Gidney, Shutty and Jones, "Magic state cultivation: growing T states as cheap as CNOT gates", arXiv:2409.17595'
    url: https://arxiv.org/abs/2409.17595
    status: checked
    note: Abstract read. The comparison is the authors' own.

  - claim: "The cost of the best known classical simulation of Clifford+T circuits grows exponentially with the number of T gates."
    where: [/learn/gates-circuits-and-the-expensive-gate/]
    source: 'Bravyi and Gosset, "Improved classical simulation of quantum circuits dominated by Clifford gates", Phys. Rev. Lett. 116, 250501 (2016), arXiv:1601.07601'
    url: https://arxiv.org/abs/1601.07601
    status: checked
    note: Abstract read. Methods improve, so "best known" is as of that paper.

  - claim: "Small quadratic speedups are unlikely to give a practical advantage on early fault-tolerant machines, because of error-correction overhead."
    where: [/learn/what-quantum-computers-are-for/]
    source: 'Babbush, McClean, Newman, Gidney, Boixo and Neven, "Focus beyond quadratic speedups for error-corrected quantum advantage", arXiv:2011.04149'
    url: https://arxiv.org/abs/2011.04149
    status: checked
    note: Abstract read. This is the authors' estimate.

  - claim: "A classical algorithm matched a quantum recommendation algorithm and removed its claimed exponential speedup."
    where: [/learn/what-quantum-computers-are-for/]
    source: 'Tang, "A quantum-inspired classical algorithm for recommendation systems", arXiv:1807.04271'
    url: https://arxiv.org/abs/1807.04271
    status: checked
    note: Abstract read.

  - claim: "In July 2026, IBM and collaborators reported a 64-qubit depth-73 circuit with 314 T gates, encoded in 76 physical qubits, with a certified fidelity lower bound of 0.349 at 95% confidence, and claim results beyond the classical methods they tried."
    where: [/learn/what-quantum-computers-are-for/]
    source: 'Martiel et al., "Sampling hard circuits with verifiably high fidelity", arXiv:2607.25941 (28 July 2026, version 3 of 2 September 2026)'
    url: https://arxiv.org/abs/2607.25941
    status: checked
    note: Abstract read. A preprint. The claim is the authors' and is limited to the classical methods they tried.

  - claim: "Clifford circuits with stabilizer inputs and Pauli measurements can be simulated efficiently on a classical computer (the Gottesman-Knill theorem)."
    where: [/learn/gates-circuits-and-the-expensive-gate/]
    source: 'Gottesman, "The Heisenberg Representation of Quantum Computers", arXiv:quant-ph/9807006; Nielsen and Chuang, section 10.5.4'
    url: https://arxiv.org/abs/quant-ph/9807006
    status: standard
    note: Textbook result, cited and not re-derived.

  - claim: "An unknown quantum state cannot be copied (no-cloning)."
    where: [/learn/what-a-qubit-is/]
    source: 'Wootters and Zurek, "A single quantum cannot be cloned", Nature 299, 802 (1982)'
    url:
    status: standard
    note: Textbook result, cited and not re-derived.

  - claim: "T2 cannot exceed 2 T1."
    where: [/learn/why-qubits-go-wrong/]
    source: "Nielsen and Chuang, chapter 8"
    url:
    status: standard
    note: Textbook result, cited and not re-derived.

  - claim: "A rotated surface-code patch of distance d uses d^2 data qubits and d^2 - 1 check qubits, and a code of odd distance d corrects any (d - 1) / 2 errors or fewer."
    where: [/overhead/, /learn/error-correction-in-one-page/]
    source: "Fowler et al., arXiv:1208.0928; Gottesman, arXiv:quant-ph/0004072"
    url: https://arxiv.org/abs/quant-ph/0004072
    status: standard
    note: The figure's layout is also checked by the site build, which verifies four X checks and four Z checks that all commute.

  - claim: "For probabilistic error cancellation, the number of circuit runs needed grows exponentially with the total noise in the circuit."
    where: [/learn/why-qubits-go-wrong/]
    source: 'Temme, Bravyi and Gambetta, "Error mitigation for short-depth quantum circuits", Phys. Rev. Lett. 119, 180509 (2017), arXiv:1612.02058'
    url: https://arxiv.org/abs/1612.02058
    status: standard
    note: The abstract names the two methods but does not state the scaling; the scaling is a well-known property of the method, cited to the full paper and not re-read on that date.

  - claim: "In the surface code, Clifford gates between logical qubits can be carried out by changing which parities are measured (lattice surgery), without a magic state."
    where: [/learn/gates-circuits-and-the-expensive-gate/]
    source: 'Horsman, Fowler, Devitt and Van Meter, "Surface code quantum computing by lattice surgery", New J. Phys. 14, 123011 (2012), arXiv:1111.4022'
    url: https://arxiv.org/abs/1111.4022
    status: standard
    note: Cited and not re-read on that date. Fowler et al., arXiv:1208.0928, show the same for braiding.

  - claim: "Shor's algorithm factors integers in polynomial time, and the best known classical algorithm (the general number field sieve) is sub-exponential but not polynomial."
    where: [/learn/what-quantum-computers-are-for/]
    source: 'Shor, "Polynomial-time algorithms for prime factorization and discrete logarithms on a quantum computer", SIAM J. Comput. 26, 1484 (1997)'
    url:
    status: standard
    note: Textbook result, cited and not re-read on that date.

  - claim: "Grover's algorithm searches N unstructured items in about the square root of N steps."
    where: [/learn/what-quantum-computers-are-for/]
    source: "Grover, \"A fast quantum mechanical algorithm for database search\", Proceedings of STOC 1996; Nielsen and Chuang, chapter 6"
    url:
    status: standard
    note: Textbook result, cited and not re-read on that date.

  - claim: "A distance-5 surface code ran with a real-time decoder at an average latency of 63 microseconds, for up to a million cycles, with a cycle time of 1.1 microseconds."
    where: [/decoder/]
    source: 'Google Quantum AI, "Quantum error correction below the surface code threshold", arXiv:2408.13687 (Nature 638, 920, 2025)'
    url: https://arxiv.org/abs/2408.13687
    status: checked
    note: Abstract read. The paper's own figures; the text on the page that the decoder "must have processed rounds in parallel or in a pipeline" is an inference from them, not a statement in the abstract.

  - claim: "Sixteen pages pass axe-core 4.10.2's WCAG 2.0, 2.1 and 2.2 level A and AA rules and its best-practice rules in a light and a dark theme."
    where: [/colophon/]
    source: "An audit run on 23 October 2026 on a preview build; the build changed secondary-text colours as a result"
    url:
    status: derived
    note: Automated rules only. Not a statement of conformance to WCAG, which needs manual and assistive-technology testing.

  - claim: "Experiments with entangled photons established the violation of Bell inequalities; the 2022 Nobel Prize in Physics went to Aspect, Clauser and Zeilinger for them."
    where: [/learn/entanglement/]
    source: "The Nobel Prize in Physics 2022, nobelprize.org"
    url: https://www.nobelprize.org/prizes/physics/2022/summary/
    status: standard
    note: Cited and not re-read on that date; the prize page could not be fetched by the build's checker.

  - claim: "A theory in which each particle carries pre-set answers cannot give a CHSH value above 2; quantum mechanics predicts up to 2 times the square root of 2 (about 2.83); for a Bell pair measured in one plane the results agree with probability cos^2(theta/2)."
    where: [/learn/entanglement/]
    source: 'Clauser, Horne, Shimony and Holt, Phys. Rev. Lett. 23, 880 (1969); Nielsen and Chuang, section 2.6'
    url:
    status: standard
    note: Textbook results, cited and not re-derived. The simulation on the page samples from the quantum prediction and does not test it.

  - claim: "A March 2026 preprint estimates that Shor's algorithm could run with as few as 10,000 reconfigurable neutral-atom qubits: a few days for discrete logarithms on the P-256 curve with 26,000 qubits, and one to two orders of magnitude longer for RSA-2048, under stated assumptions."
    where: [/learn/what-quantum-computers-are-for/, /pqc/what-a-quantum-computer-breaks/]
    source: 'Cain, Xu, King, Picard, Levine, Endres, Preskill, Huang and Bluvstein, "Shor''s algorithm is possible with as few as 10,000 reconfigurable atomic qubits", arXiv:2603.28627 (30 March 2026)'
    url: https://arxiv.org/abs/2603.28627
    status: checked
    note: Abstract read on 23 October 2026. A theoretical estimate and a preprint. The authors state that substantial engineering challenges remain.

  - claim: "In 2019 Gidney and Ekerå estimated that a 2048-bit RSA number could be factored in eight hours by a quantum computer with 20 million noisy qubits."
    where: [/pqc/what-a-quantum-computer-breaks/]
    source: 'Gidney and Ekerå, "How to factor 2048 bit RSA integers in 8 hours using 20 million noisy qubits", arXiv:1905.09749 (2019)'
    url: https://arxiv.org/abs/1905.09749
    status: checked
    checked_on: 2026-11-08
    note: Title read, and the figures confirmed by the abstract of Gidney's 2025 paper, which restates them.

  - claim: "Shor's algorithm factors integers and computes discrete logarithms in polynomial time on a quantum computer."
    where: [/pqc/what-a-quantum-computer-breaks/]
    source: 'Shor, "Polynomial-time algorithms for prime factorization and discrete logarithms on a quantum computer", arXiv:quant-ph/9508027'
    url: https://arxiv.org/abs/quant-ph/9508027
    status: standard
    note: Title and authorship confirmed. The result is textbook material, cited and not re-derived.

  - claim: "Grover's algorithm searches an unstructured space of size N in about the square root of N steps, and the square root cannot be improved for unstructured search, including by running many machines in parallel."
    where: [/pqc/symmetric-cryptography-survives/]
    source: 'Grover, arXiv:quant-ph/9605043; Zalka, "Grover''s quantum searching algorithm is optimal", arXiv:quant-ph/9711070'
    url: https://arxiv.org/abs/quant-ph/9711070
    status: standard
    note: Titles and authorship confirmed. Textbook results, cited and not re-derived. The statement about parallel machines was not re-read in Zalka's paper.

  - claim: "NIST IR 8547, published in October 2026, says quantum-vulnerable signature and key-establishment algorithms will be deprecated after 2030 and disallowed under NIST standards after 2035."
    where: [/pqc/, /pqc/harvest-now-decrypt-later/, /pqc/are-you-already-late/]
    source: 'NIST IR 8547, "Transition to Post-Quantum Cryptography Standards", October 2026'
    url: https://doi.org/10.6028/NIST.IR.8547
    status: checked
    checked_on: 2026-11-08
    note: The report was read, including the signature table and the key-establishment passage. The tables list RSA and ECDSA at 112 bits or more, EdDSA at 128 bits or more, and elliptic-curve DH and MQV at 112 bits or more.

  - claim: "The report says federal high-value assets and other prioritised systems are held to earlier deadlines under EO 14412 and OMB Memorandum M-26-15, including quantum-resistant key establishment by 31 December 2030."
    where: [/pqc/are-you-already-late/]
    source: 'NIST IR 8547, October 2026, as it describes OMB Memorandum M-26-15'
    url: https://doi.org/10.6028/NIST.IR.8547
    status: checked
    checked_on: 2026-11-08
    note: Read in NIST IR 8547. The memorandum itself was not read, so this records what NIST says it requires.

  - claim: "NIST IR 8547 names harvest now, decrypt later as a reason for requiring or recommending migration of key establishment before the classical schemes are generally disallowed."
    where: [/pqc/harvest-now-decrypt-later/]
    source: 'NIST IR 8547, October 2026'
    url: https://doi.org/10.6028/NIST.IR.8547
    status: checked
    checked_on: 2026-11-08
    note: Read in the key-establishment passage of the report.

  - claim: "NIST published FIPS 203, 204 and 205 on 13 August 2024, and lists FN-DSA as FIPS 206 in development and HQC as selected for standardization on 11 March 2025."
