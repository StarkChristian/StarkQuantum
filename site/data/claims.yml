  - claim: "Mosca's framework compares the time data must stay secret, the time a migration takes, and the time until a machine that breaks current cryptography exists."
    where: [/pqc/are-you-already-late/]
    source: 'Mosca, "Cybersecurity in an era with quantum computers: will we be ready?", IACR ePrint 2015/1075'
    url: https://eprint.iacr.org/2015/1075
    status: standard
    checked_on: 2026-11-08
    note: Abstract read. The three-quantity inequality is the commonly cited form of the framework and was not re-read in the full paper. The paper also gives a probability estimate for the hardware, which this site does not repeat.
